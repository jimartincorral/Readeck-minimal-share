name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # The release build is unsigned here; it's built to catch R8/shrinking problems early.
      - name: Build, lint and test
        run: ./gradlew --no-daemon assembleDebug assembleRelease lintRelease testDebugUnitTest

      - uses: actions/upload-artifact@v4
        with:
          name: readeck-share-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
